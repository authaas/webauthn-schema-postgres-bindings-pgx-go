name: CD

run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - '!v*'

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Clone identity-schema-postgres
        uses: actions/checkout@v7
        with:
          ref: 0.1.1
          repository: ${{ github.repository_owner }}/identity-schema-postgres
          path: schema/identity

      - name: Clone webauthn-schema-postgres
        uses: actions/checkout@v7
        with:
          ref: 0.1.2
          repository: ${{ github.repository_owner }}/webauthn-schema-postgres
          path: schema/webauthn

      - name: Generate from sqlc
        run: sqlc generate

      - name: Pop release
        uses: katastroma/skeuotheke/.github/actions/pop-release@v0
        with:
          ecosystem: module
